name: Generate Snake Animation

on:
  schedule:
    # Roz raat 12:00 UTC pe automatically chalega
    - cron: "0 0 * * *"
  # Manually bhi chala sakte ho Actions tab se
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate snake from contribution graph
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: prem-2255
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
